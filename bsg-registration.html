<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Event Registration | BSG Ltd</title>
  <meta name="description" content="Event registration form for BSG Ltd, built by KWIZERA Aime Serge." />
  <meta name="theme-color" content="#FF8A1F" />

  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='4' y='4' width='56' height='56' rx='18' fill='%23FF8A1F' stroke='%23E0B13A' stroke-width='5'/%3E%3Cpath d='M25 22L14 32l11 10M39 22l11 10-11 10M35 19l-6 26' fill='none' stroke='%23000' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />

  <!-- Apply the saved theme before the page paints -->
  <script>
    (function () {
      var saved = localStorage.getItem("theme");
      var preferred = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", saved || preferred);
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="bsg-registration.css" />
  <script src="bsg-registration.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="back" href="portfolio.html#projects">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      Back to portfolio
    </a>

    <button class="icon-btn" id="themeToggle" type="button" aria-label="Switch to light mode">
      <svg class="icon-sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
      </svg>
      <svg class="icon-moon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
      </svg>
    </button>
  </header>

  <main class="stage">
    <section class="card" aria-labelledby="formTitle">

      <!-- ============ The form ============ -->
      <form id="regForm" novalidate>
        <p class="org">BSG Ltd</p>
        <h1 id="formTitle">Event registration</h1>
        <p class="lead">Fill in your details to reserve your place. Fields marked * are required.</p>

        <div class="field">
          <label for="fullName">Full name *</label>
          <input id="fullName" name="fullName" type="text" autocomplete="name" required />
          <p class="error" id="fullNameError" role="alert"></p>
        </div>

        <div class="field">
          <label for="email">Email *</label>
          <input id="email" name="email" type="email" autocomplete="email" required />
          <p class="error" id="emailError" role="alert"></p>
        </div>

        <div class="row">
          <div class="field">
            <label for="phone">Phone number *</label>
            <input id="phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="+250 ..." required />
            <p class="error" id="phoneError" role="alert"></p>
          </div>

          <div class="field">
            <label for="attendees">Number of attendees *</label>
            <input id="attendees" name="attendees" type="number" min="1" max="10" value="1" inputmode="numeric" required />
            <p class="error" id="attendeesError" role="alert"></p>
          </div>
        </div>

        <div class="field">
          <label for="organisation">Company or organisation <span class="optional">(optional)</span></label>
          <input id="organisation" name="organisation" type="text" autocomplete="organization" />
        </div>

        <div class="field">
          <label for="notes">Notes or special requirements <span class="optional">(optional)</span></label>
          <textarea id="notes" name="notes" rows="3"></textarea>
        </div>

        <div class="field check">
          <input id="consent" name="consent" type="checkbox" required />
          <label for="consent">I agree to be contacted about this event. *</label>
        </div>
        <p class="error" id="consentError" role="alert"></p>

        <p class="status" id="formStatus" role="alert"></p>

        <button class="btn" id="submitBtn" type="submit">Register</button>
      </form>

      <!-- ============ Confirmation (hidden until the form is sent) ============ -->
      <div class="success" id="success" hidden tabindex="-1">
        <div class="tick" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
        </div>
        <h2 id="successTitle">You're registered</h2>
        <p class="lead">A confirmation will be sent to the email below.</p>

        <dl class="summary" id="summary"></dl>

        <p class="demo-note" id="demoNote" hidden>Demo mode: this form is not connected to a server, so these details were not stored.</p>

        <button class="btn btn-ghost" id="againBtn" type="button">Register another person</button>
      </div>

    </section>
  </main>
</body>
</html>
