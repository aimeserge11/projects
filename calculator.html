<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Calculator | Aime Serge</title>
  <meta name="description" content="A simple calculator with keyboard support and light and dark modes, built by KWIZERA Aime Serge." />
  <meta name="theme-color" content="#FF8A1F" />

  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='4' y='4' width='56' height='56' rx='18' fill='%23FF8A1F' stroke='%23E0B13A' stroke-width='5'/%3E%3Cpath d='M25 22L14 32l11 10M39 22l11 10-11 10M35 19l-6 26' fill='none' stroke='%23000' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />

  <!-- Apply the saved theme before the page paints -->
  <script>
    (function () {
      var saved = localStorage.getItem("theme");
      var preferred = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", saved || preferred);
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="calculator.css" />
  <script src="calculator.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="back" href="portfolio.html#projects">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      Back to portfolio
    </a>

    <button class="icon-btn" id="themeToggle" type="button" aria-label="Switch to light mode">
      <svg class="icon-sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
      </svg>
      <svg class="icon-moon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
      </svg>
    </button>
  </header>

  <main class="stage">
    <section class="calc" aria-label="Calculator">
      <div class="screen">
        <div id="history" aria-hidden="true"></div>
        <div id="display" role="status" aria-live="polite" aria-atomic="true">0</div>
      </div>

      <div class="keys" id="keys">
        <button type="button" class="fn" data-action="clear" aria-label="All clear">AC</button>
        <button type="button" class="fn" data-action="back" aria-label="Backspace">&#9003;</button>
        <button type="button" class="fn" data-action="percent" aria-label="Percent">%</button>
        <button type="button" class="op" data-op="/" aria-label="Divide">&divide;</button>

        <button type="button" data-num="7">7</button>
        <button type="button" data-num="8">8</button>
        <button type="button" data-num="9">9</button>
        <button type="button" class="op" data-op="*" aria-label="Multiply">&times;</button>

        <button type="button" data-num="4">4</button>
        <button type="button" data-num="5">5</button>
        <button type="button" data-num="6">6</button>
        <button type="button" class="op" data-op="-" aria-label="Subtract">&minus;</button>

        <button type="button" data-num="1">1</button>
        <button type="button" data-num="2">2</button>
        <button type="button" data-num="3">3</button>
        <button type="button" class="op" data-op="+" aria-label="Add">+</button>

        <button type="button" class="wide" data-num="0">0</button>
        <button type="button" data-action="dot" aria-label="Decimal point">.</button>
        <button type="button" class="eq" data-action="equals" aria-label="Equals">=</button>
      </div>
    </section>

    <p class="hint">Keyboard works too: numbers, + &minus; * /, Enter, Backspace and Esc.</p>
  </main>
</body>
</html>
